name: Kubernetes Services Health Check

on:
  pull_request:
    branches: [ main, develop ]
  push:
    branches: [ main, develop ]

jobs:
  check-k8s-services:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Free Disk Space on Runner
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo docker image prune --all --force        

      - name: Start Minikube
        uses: medyagh/setup-minikube@master
        with:
          minikube-version: 'latest'
          driver: 'docker'
          cpus: 2
          memory: 6000mb

      - name: Verify Minikube & kubectl
        run: |
          kubectl cluster-info
          kubectl get nodes

      - name: Deploy Services to Kubernetes
        run: |
          kubectl create namespace ml-training --dry-run=client -o yaml | kubectl apply -f -
          kubectl apply -f k8s/base/ -n ml-training
          kubectl apply -f k8s/services/ -n ml-training
          kubectl apply -f k8s/monitoring/ -n ml-training
#          kubectl apply -f k8s/pipeline/ -n ml-training

      - name: Wait for Deployments to become Available
        run: |
          echo "Waiting for Airflow..."
          kubectl rollout status deployment/airflow -n ml-training --timeout=360s

          echo "Waiting for MLflow..."
          kubectl rollout status deployment/mlflow -n ml-training --timeout=240s

          echo "Waiting for Zookeeper..."
          kubectl rollout status deployment/zookeeper -n ml-training --timeout=240s

          echo "Waiting for Kafka..."
          kubectl rollout status deployment/kafka -n ml-training --timeout=240s

          echo "Waiting for Prometheus..."
          kubectl rollout status deployment/prometheus -n ml-training --timeout=240s

          echo "Waiting for Grafana..."
          kubectl rollout status deployment/grafana -n ml-training --timeout=240s

      - name: Verify Pod Status and Services
        if: always()
        run: |
          echo "=== Pods Status ==="
          kubectl get pods -n ml-training -o wide

          echo "=== Services Status ==="
          kubectl get svc -n ml-training