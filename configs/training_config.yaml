# ============================================================
# Data
# ============================================================

data:

  data_dir: data/raw

  data_path: data/raw/ai4i2020.csv

  feature_columns:
    - Air temperature [K]
    - Process temperature [K]
    - Rotational speed [rpm]
    - Torque [Nm]
    - Tool wear [min]

  label_column: Machine failure


# ============================================================
# Training
# ============================================================

training:

  batch_size: 64

  epochs: 5


# ============================================================
# MLP
# ============================================================

mlp:

  hidden_size: 32


# ============================================================
# LSTM
# ============================================================

lstm:

  hidden_size: 32

  num_layers: 1


# ============================================================
# torch.compile
# ============================================================

torch_compile:

  enabled: true

  mode: default


# ============================================================
# Ray
# ============================================================

ray:

  num_trees:
    - 50
    - 100

  max_depth:
    - 5
    - 10


# ============================================================
# MLflow
# ============================================================

mlflow:

  tracking_uri: sqlite:///mlflow.db

  experiment_name: predictive_maintenance