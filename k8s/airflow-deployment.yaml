apiVersion: apps/v1
kind: Deployment
metadata:
  name: airflow
  labels:
    app: airflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: airflow
  template:
    metadata:
      labels:
        app: airflow
    spec:
      containers:
        - name: airflow
          image: apache/airflow:3.0.2
          command: ["airflow", "standalone"]
          env:
            - name: AIRFLOW__CORE__LOAD_EXAMPLES
              value: "false"
          ports:
            - containerPort: 8080