name: Continuous Deployment Predictive Maintenance

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # Required to push images to GitHub Container Registry

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set Lowercase Repository Name
        run: |
          echo "IMAGE_TAG=ghcr.io/${{ github.repository_owner }}/mlops_learning_project:latest" | tr '[:upper:]' '[:lower:]' >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.serve
          push: true
          tags: ${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Setup Minikube (For Continuous Deployment)
        uses: medyagh/setup-minikube@master
        with:
          minikube-version: 'latest'

      - name: Deploy to Kubernetes
        run: |
          # 1. Create namespace if missing
          kubectl create namespace ml-training --dry-run=client -o yaml | kubectl apply -f -

          # 2. Apply manifests in dependency order
          kubectl apply -f k8s/base/ -n ml-training
          kubectl apply -f k8s/services/ -n ml-training
          kubectl apply -f k8s/monitoring/ -n ml-training

          # 3. Update container image in the ml-training namespace
          kubectl set image deployment/mlflow mlflow=${{ env.IMAGE_TAG }} -n ml-training

          # 4. Verify rollout status
          kubectl rollout status deployment/mlflow -n ml-training --timeout=180s

      - name: Post-Deployment Smoke Test
        run: |
          # Start port-forwarding in background
          kubectl port-forward svc/mlflow-service 8000:5000 -n ml-training &
          PID=$!

          # Wait for port-forward connection to be established
          echo "Waiting for port-forward to become active..."
          RESPONSE="000"
          for i in {1..15}; do
            RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/ || echo "000")
            if [ "$RESPONSE" = "200" ]; then
              break
            fi
            sleep 2
          done

          echo "HTTP Response Code: $RESPONSE"

          # Kill background port-forward
          kill $PID || true

          # Evaluate response
          if [ "$RESPONSE" != "200" ]; then
            echo "Deployment smoke test failed!"
            echo "=== Pod Status ==="
            kubectl get pods -n ml-training
            echo "=== Pod Logs ==="
            kubectl logs -l app=mlflow -n ml-training --tail=50
            exit 1
          fi