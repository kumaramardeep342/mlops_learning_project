name: Predictive Maintenance CI Pipeline
on:
  pull_request:
    branches: [ main , develop ]
  push:
    branches: [ main , develop ]

jobs:
  health-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify Environment and Structure
        run: |
          echo "=== GitHub Action is running successfully ==="
          python --version
          echo "Checking repository structure:"
          ls -la