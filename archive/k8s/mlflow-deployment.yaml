apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mlflow
  template:
    metadata:
      labels:
        app: mlflow
    spec:
      containers:
        - name: mlflow
          image: ghcr.io/mlflow/mlflow:v3.1.0
          command: ["mlflow", "server"]
          args:
            - "--host"
            - "$(MLFLOW_HOST)"
            - "--port"
            - "$(MLFLOW_PORT)"
          envFrom:
            - configMapRef:
                name: mlflow-config
          ports:
            - containerPort: 5000