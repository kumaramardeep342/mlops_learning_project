apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mlops-pvc
  namespace: ml-training
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: batch/v1
kind: Job
metadata:
  name: mlops-train-job
  namespace: ml-training
spec:
  template:
    spec:
      containers:
        - name: trainer
          image: mlops-train:v1
          imagePullPolicy: Never
          resources:
            requests:
              cpu: "2"
              memory: "4Gi"
            limits:
              cpu: "2"
              memory: "4Gi"
              # nvidia.com/gpu: "1"  # Commented out for CPU testing
          volumeMounts:
            - mountPath: /app/configs
              name: config-volume
            - mountPath: /app/data
              name: data-storage
            - mountPath: /app/checkpoints
              name: checkpoint-storage
      restartPolicy: Never
      # nodeSelector:                # Commented out for CPU testing
      #   accelerator: nvidia-gpu
      # tolerations:                 # Commented out for CPU testing
      #   - key: "nvidia.com/gpu"
      #     operator: "Exists"
      #     effect: "NoSchedule"
      volumes:
        - name: config-volume
          configMap:
            name: training-config
        - name: data-storage
          persistentVolumeClaim:
            claimName: mlops-pvc
        - name: checkpoint-storage
          persistentVolumeClaim:
            claimName: mlops-pvc
  backoffLimit: 2