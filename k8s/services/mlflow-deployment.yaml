apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow
  namespace: ml-training
  namespace: ml-training
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mlflow
  template:
    metadata:
      labels:
        app: mlflow
    spec:
      containers:
        - name: mlflow
          image: ghcr.io/mlflow/mlflow:v3.1.0
          command: ["mlflow", "server"]
          args:
            - "--host=0.0.0.0"
            - "--port=5000"
            - "--backend-store-uri=sqlite:////mlflow/mlflow.db"
            - "--default-artifact-root=/mlflow/artifacts"
          ports:
            - containerPort: 5000
          volumeMounts:
            - mountPath: /mlflow
              name: mlflow-storage
      volumes:
        - name: mlflow-storage
          persistentVolumeClaim:
            claimName: mlops-pvc # Mounts PVC so sqlite file persists across pod restarts