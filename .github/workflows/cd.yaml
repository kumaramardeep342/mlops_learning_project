name: Continuous Deployment Predictive Maintenance

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # Required to push images to GitHub Container Registry

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:latest

      - name: Setup Minikube (For CI/Testing)
        uses: medyagh/setup-minikube@master
        with:
          minikube-version: 'latest'

      - name: Deploy to Kubernetes
        run: |
          # 1. Create namespace if missing
          kubectl create namespace ml-training --dry-run=client -o yaml | kubectl apply -f -

          # 2. Apply manifests in dependency order
          kubectl apply -f k8s/base/ -n ml-training
          kubectl apply -f k8s/services/ -n ml-training
          kubectl apply -f k8s/monitoring/ -n ml-training

          # 3. Update container image in the ml-training namespace
          kubectl set image deployment/mlflow mlflow=ghcr.io/${{ github.repository }}:latest -n ml-training

          # 4. Verify rollout
          kubectl rollout status deployment/mlflow -n ml-training --timeout=180s
      
      - name: Post-Deployment Smoke Test
        run: |
          # Forward host port to the deployment inside Kubernetes
          kubectl port-forward svc/mlflow-service 8000:5000 -n ml-training &
          PID=$!
          sleep 5

          # Test endpoint availability
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/)

          # Kill port-forward process
          kill $PID

          if [ "$RESPONSE" -ne 200 ]; then
            echo "Deployment smoke test failed!"
            exit 1
          fi