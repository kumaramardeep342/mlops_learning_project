[project]
name = "mlops-learning-project"
version = "0.1.0"
description = "End-to-End MLOps Project from development to production."
readme = "README.md"
requires-python = ">=3.12,<3.13"

# Common base dependencies shared across environments
dependencies = [
    "numpy==2.3.0",
    "pandas==2.3.0",
    "torch>=2.13.0",
    "torchvision>=0.28.0",
    "python-dotenv==1.1.0",
    "joblib==1.5.1",
    "pyyaml==6.0.2",
    "pathspec==0.12.1",
]

[project.optional-dependencies]
# Training specific dependencies
train = [
    "scikit-learn==1.7.0",
    "matplotlib==3.10.3",
    "seaborn==0.13.2",
    "pyspark==3.5.6",
    "ray>=2.56.1",
    "apache-beam>=2.72.0",
    "kafka-python>=3.0.7",
    "mlflow>=3.14.0",
    "dvc[gdrive]>=3.63.0",
    "xgboost==3.0.2",
    "lightgbm>=4.7.0",
    "faker>=40.21.0",
    "pyopenssl>=25.1.0",
]

# Serving specific dependencies
serve = [
    "fastapi==0.116.0",
    "uvicorn==0.35.0",
    "pydantic",
    "python-multipart>=0.0.32",
    "prometheus-fastapi-instrumentator>=7.0.0",
    "pyspark==3.5.6",
]

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
    "pytest==8.4.1",
    "ruff>=0.12.0",
    "httpx>=0.28.0",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
package = false