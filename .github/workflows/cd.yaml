name: Continuous Deployment Predictive Maintenance

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # Required to push images to GitHub Container Registry

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Free up disk space on GitHub runner host before starting Minikube
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          docker system prune -af

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.serve
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Setup Minikube (For Continuous Deployment)
        uses: medyagh/setup-minikube@master
        with:
          minikube-version: 'latest'
          driver: 'docker'
          cpus: 2
          memory: 6000mb

      - name: Deploy to Kubernetes
        run: |
          # 1. Create namespace if missing
          kubectl create namespace ml-training --dry-run=client -o yaml | kubectl apply -f -

          # 2. Create imagePullSecret for GHCR access
          kubectl create secret docker-registry ghcr-secret \
            --namespace=ml-training \
            --docker-server=ghcr.io \
            --docker-username=${{ github.actor }} \
            --docker-password=${{ secrets.GITHUB_TOKEN }} \
            --dry-run=client -o yaml | kubectl apply -f -

          # 3. Apply base manifests
          kubectl apply -f k8s/base/ -n ml-training
          kubectl apply -f k8s/services/ -n ml-training
          kubectl apply -f k8s/monitoring/ -n ml-training

          # 4. Patch MLflow deployment strategy (clearing rollingUpdate parameters)
          kubectl patch deployment mlflow -n ml-training --type=json -p='[
            {"op": "replace", "path": "/spec/strategy/type", "value": "Recreate"},
            {"op": "remove", "path": "/spec/strategy/rollingUpdate"}
          ]' || true

          # 5. Load image into Minikube and force restart deployment
          minikube image load ${{ steps.meta.outputs.tags }}
          kubectl rollout restart deployment/mlflow -n ml-training

          # 6. Verify rollout status
          if ! kubectl rollout status deployment/mlflow -n ml-training --timeout=180s; then
            echo "=== Rollout Failed! Pod Status: ==="
            kubectl get pods -n ml-training
            echo "=== Pod Descriptions & Events: ==="
            kubectl describe pods -l app=mlflow -n ml-training
            exit 1
          fi

      - name: Post-Deployment Smoke Test
        run: |
          # Start port-forwarding in background
          kubectl port-forward svc/mlflow-service 8000:5000 -n ml-training &
          PID=$!

          # Wait for port-forward connection to be established
          echo "Waiting for port-forward to become active..."
          RESPONSE="000"
          for i in {1..15}; do
            RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/ || echo "000")
            if [ "$RESPONSE" = "200" ]; then
              break
            fi
            sleep 2
          done

          echo "HTTP Response Code: $RESPONSE"

          # Kill background port-forward
          kill $PID || true

          # Evaluate response
          if [ "$RESPONSE" != "200" ]; then
            echo "Deployment smoke test failed!"
            echo "=== Pod Status ==="
            kubectl get pods -n ml-training
            echo "=== Pod Logs ==="
            kubectl logs -l app=mlflow -n ml-training --tail=50
            exit 1
          fi