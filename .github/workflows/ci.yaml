name: Continuous Integration Predictive Maintenance

on:
  push:
    branches: [ main , develop ]
  pull_request:
    branches: [ main , develop ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies with uv
        run: |
          uv sync --all-groups

      - name: Run Unit Tests
        run: |
          uv run pytest tests/

      # - name: Run Unit Tests
      #   run: |
      #     PYTHONPATH=. pytest tests/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Training Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.train
          tags: mlops-train:latest
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Serving Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.serve
          tags: mlops-serve:latest
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max